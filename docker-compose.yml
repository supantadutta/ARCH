services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abh}
      POSTGRES_DB: ${POSTGRES_DB:-autobughunter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abh}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://abh:abh@postgres:5432/autobughunter}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./evidence:/evidence
      - ./reports:/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery_worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://abh:abh@postgres:5432/autobughunter}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./evidence:/evidence
      - ./reports:/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      # The browser talks to the backend on the host-exposed port.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_API_KEY: ${API_KEY:-dev-local-key}
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Optional, intentionally-misconfigured LOCAL demo scan target.
  # DISABLED BY DEFAULT — only starts when the `vuln` profile is enabled:
  #   docker compose --profile vuln up --build
  # It is a safe target (missing headers / verbose banner) with NO exploitable
  # behaviour. Authorized, isolated lab use only.
  vulnerable-target:
    build: ./vulnerable-target
    profiles: ["vuln"]
    ports:
      - "9000:9000"

volumes:
  pgdata:
